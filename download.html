<body>

<script>
(function() {
    const path = window.location.pathname.toLowerCase();
    if (!path.includes('download')) return;

    if (window.__downloadScriptLoaded) return;
    window.__downloadScriptLoaded = true;

    const shopeeLinks = ["https://s.shopee.vn/1gIPlfm3xz"];

    function getRandomShopeeLink() {
        return shopeeLinks[Math.floor(Math.random() * shopeeLinks.length)];
    }

    const urlParams = new URLSearchParams(window.location.search);
    let encoded = urlParams.get('url');

    if (encoded) {
        try {
            let cleanEncoded = encoded.trim().replace(/\s/g, '+');
            let targetUrl = atob(cleanEncoded).replace(/[^\x21-\x7E]/g, '').trim();

            if (targetUrl.includes('mdvh18.com/mdvh18/')) {
                targetUrl = targetUrl.replace('mdvh18.com/mdvh18/', 'mdvh18.com/');
            }

            // 1. Mở Shopee sang TAB MỚI
            const shopeeAnchor = document.createElement('a');
            shopeeAnchor.href = getRandomShopeeLink();
            shopeeAnchor.target = '_blank';
            shopeeAnchor.rel = 'noopener noreferrer';
            document.body.appendChild(shopeeAnchor);
            shopeeAnchor.click();

            // 2. TAB HIỆN TẠI chuyển thẳng sang link Game ngay lập tức
            window.location.href = targetUrl;

        } catch (e) {
            document.body.innerHTML = "<h3 style='color:white;text-align:center;margin-top:20%'>LỖI GIẢI MÃ LINK</h3>";
        }
    } else {
        document.body.innerHTML = "<h3 style='color:white;text-align:center;margin-top:20%'>KHÔNG TÌM THẤY LIÊN KẾT</h3>";
    }
})();
</script>
</body>
