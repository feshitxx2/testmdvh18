<body>
    <div class="box" id="main-box">

        </h3>
        <p id="status-text">

        </p>
        <div id="ad-notice" class="ad-notice">

        </div>
        <div id="timer">4</div>
        <button id="fast-link" class="btn-fast">

        </button>
        <a id="manual-link"

           href="#"
           target="_self">

        </a>

        </div>
    </div>
    <script>
        (function () {
            /* =========================================================
               DANH SÁCH LINK QUẢNG CÁO
               Thay các link mẫu bên dưới bằng link thật của bạn.
               ========================================================= */
            const adLinks = [
                "https://shope.ee/link1",
                "https://shope.ee/link2",
                "https://shope.ee/link3",
                "https://shope.ee/link4",
                "https://shope.ee/link5",
                "https://shope.ee/link6",
                "https://shope.ee/link7",
                "https://shope.ee/link8",
                "https://shope.ee/link9",
                "https://shope.ee/link10"
            ];
            /* =========================================================
               CHỌN RANDOM LINK QUẢNG CÁO
               ========================================================= */
            function getRandomAdLink() {
                if (!adLinks.length) {
                    return null;
                }
                return adLinks[
                    Math.floor(Math.random() * adLinks.length)
                ];
            }
            /* =========================================================
               KIỂM TRA ẨN DANH
               ========================================================= */
            function checkIncognito() {
                return new Promise((resolve) => {
                    const fs =
                        window.RequestFileSystem ||
                        window.webkitRequestFileSystem;
                    if (fs) {
                        fs(
                            window.TEMPORARY,
                            100,
                            function () {
                                resolve(false);
                            },
                            function () {
                                resolve(true);
                            }
                        );
                        return;
                    }
                    if (
                        "storage" in navigator &&
                        "estimate" in navigator.storage
                    ) {
                        navigator.storage
                            .estimate()
                            .then(({ quota }) => {
                                if (quota < 400000000) {
                                    resolve(true);
                                } else {
                                    resolve(false);
                                }
                            })
                            .catch(() => {
                                resolve(false);
                            });
                        return;
                    }
                    try {
                        const db =
                            indexedDB.open("mdvh18_incognito_test");
                        db.onerror = function () {
                            resolve(true);
                        };
                        db.onsuccess = function () {
                            resolve(false);
                        };
                    } catch (e) {
                        resolve(true);
                    }
                });
            }
            /* =========================================================
               STORAGE AN TOÀN
               ========================================================= */
            function safeGet(key) {
                try {
                    return (
                        localStorage.getItem(key) ||
                        sessionStorage.getItem(key)
                    );
                } catch (e) {
                    try {
                        return sessionStorage.getItem(key);
                    } catch (e2) {
                        return null;
                    }
                }
            }
            function safeSet(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {}
                try {
                    sessionStorage.setItem(key, value);
                } catch (e) {}
            }
            /* =========================================================
               KIỂM TRA ĐÃ VƯỢT QUẢNG CÁO TRONG 7 NGÀY CHƯA
               ========================================================= */
            function isAdBypassed() {
                const bypassTime =
                    safeGet("shopee_click_time");
                if (!bypassTime) {
                    return false;
                }
                const now =
                    Date.now();
                const sevenDays =
                    7 *
                    24 *
                    60 *
                    60 *
                    1000;
                if (
                    now -
                    parseInt(bypassTime, 10)
                    <
                    sevenDays
                ) {
                    return true;
                }
                try {
                    localStorage.removeItem(
                        "shopee_click_time"
                    );
                } catch (e) {}
                try {
                    sessionStorage.removeItem(
                        "shopee_click_time"
                    );
                } catch (e) {}
                return false;
            }
            /* =========================================================
               GHI NHẬN ĐÃ MỞ QUẢNG CÁO
               ========================================================= */
            function markAdClicked() {
                safeSet(
                    "shopee_click_time",
                    Date.now().toString()
                );
            }
            /* =========================================================
               CHUYỂN LINK
               ========================================================= */
            function redirectTo(url) {
                if (!url) {
                    return;
                }
                window.location.replace(url);
            }
            /* =========================================================
               MỞ QUẢNG CÁO
               ========================================================= */
            function openAdvertisement(adUrl) {
                if (!adUrl) {
                    return false;
                }
                /*
                 * Quan trọng:
                 * window.open được gọi trực tiếp bên trong
                 * sự kiện click của người dùng.
                 *
                 * Vì vậy trình duyệt ít khả năng chặn popup hơn.
                 */
                const adWindow =
                    window.open(
                        adUrl,
                        "_blank",
                        "noopener,noreferrer"
                    );
                /*
                 * Đánh dấu đã click quảng cáo.
                 */
                markAdClicked();
                /*
                 * Nếu browser chặn popup thì vẫn tiếp tục tải.
                 */
                if (!adWindow) {
                    showToast(
                        "⚠️",
                        "Trình duyệt đã chặn quảng cáo",
                        "Hãy cho phép cửa sổ bật lên nếu muốn mở quảng cáo.",
                        "#ffc107"
                    );
                    return false;
                }
                return true;
            }
            /* =========================================================
               TOAST
               ========================================================= */
            function showToast(
                icon,
                title,
                desc,
                color
            ) {
                const toast =
                    document.createElement("div");
                toast.className =
                    "toast-custom";
                toast.style.cssText = `
                    border: 2px solid ${color};
                    padding: 15px;
                    background: #1a1131;
                    border-radius: 10px;
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    z-index: 9999;
                    max-width: 300px;
                    transition: 0.5s;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                `;
                toast.innerHTML = `
                    <div style="
                        display:flex;
                        align-items:center;
                        margin-bottom:10px;
                    ">
                        <span style="
                            font-size:24px;
                            margin-right:10px;
                        ">
                            ${icon}
                        </span>
                        <strong style="
                            color:${color};
                            font-size:16px;
                        ">
                            ${title}
                        </strong>
                    </div>
                    <p style="
                        font-size:13px;
                        line-height:1.4;
                        margin-bottom:12px;
                        color:#e0e0e0;
                    ">
                        ${desc}
                    </p>
                    <div style="text-align:right;">
                        <a
                            href="https://mdvh18.com/p/faq.html"
                            target="_blank"
                            rel="noopener noreferrer"
                            style="
                                background:${color};
                                color:#1a1131;
                                padding:4px 10px;
                                border-radius:15px;
                                text-decoration:none;
                                font-weight:bold;
                                font-size:11px;
                            "
                        >
                            XEM FAQ
                        </a>
                    </div>
                `;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.transform =
                        "translateX(150%)";
                    setTimeout(() => {
                        toast.remove();
                    }, 800);
                }, 8000);
            }
            /* =========================================================
               MAIN
               ========================================================= */
            async function init() {
                const isIncognito =
                    await checkIncognito();
                const alertBox =
                    document.getElementById(
                        "incognito-alert"
                    );
                const adNotice =
                    document.getElementById(
                        "ad-notice"
                    );
                const timerEl =
                    document.getElementById(
                        "timer"
                    );
                const manualBtn =
                    document.getElementById(
                        "manual-link"
                    );
                const fastBtn =
                    document.getElementById(
                        "fast-link"
                    );
                const boxEl =
                    document.getElementById(
                        "main-box"
                    );
                const titleEl =
                    document.getElementById(
                        "status-title"
                    );
                const textEl =
                    document.getElementById(
                        "status-text"
                    );
                const loadingText =
                    document.getElementById(
                        "loading-text"
                    );
                /* =====================================================
                   XÁC ĐỊNH CÓ CẦN QUẢNG CÁO KHÔNG
                   ===================================================== */
                let shouldShowAd =
                    false;
                /*
                 * Ẩn danh:
                 * luôn yêu cầu quảng cáo.
                 */
                if (isIncognito) {
                    shouldShowAd = true;
                    if (alertBox) {
                        alertBox.style.display =
                            "block";
                    }
                }
                /*
                 * Không ẩn danh:
                 * sau mỗi 25 lượt tải sẽ yêu cầu quảng cáo.
                 */
                else if (!isAdBypassed()) {
                    let downloadCount =
                        parseInt(
                            safeGet(
                                "global_download_count"
                            ) || "0",
                            10
                        );
                    downloadCount++;
                    if (downloadCount >= 25) {
                        safeSet(
                            "global_download_count",
                            "0"
                        );
                        shouldShowAd = true;
                    } else {
                        safeSet(
                            "global_download_count",
                            downloadCount.toString()
                        );
                    }
                }
                /* =====================================================
                   LẤY LINK TẢI
                   ===================================================== */
                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );
                let encoded =
                    urlParams.get("url");
                if (!encoded) {
                    boxEl.innerHTML = `
                        <h3>LỖI ĐƯỜNG DẪN</h3>
                        <p>Không tìm thấy liên kết tải.</p>
                    `;
                    return;
                }
                let targetUrl = "";
                try {
                    let cleanEncoded =
                        encoded
                            .trim()
                            .replace(/\s/g, "+");
                    targetUrl =
                        atob(cleanEncoded);
                    targetUrl =
                        targetUrl
                            .replace(/[^\x21-\x7E]/g, "")
                            .trim();
                    /*
                     * Sửa đường dẫn MDVH18 cũ.
                     */
                    if (
                        targetUrl.includes(
                            "mdvh18.com/mdvh18/"
                        )
                    ) {
                        targetUrl =
                            targetUrl.replace(
                                "mdvh18.com/mdvh18/",
                                "mdvh18.com/"
                            );
                    }
                } catch (e) {
                    boxEl.innerHTML = `
                        <h3>LỖI GIẢI MÃ</h3>
                        <p>Link không hợp lệ hoặc đã bị hỏng.</p>
                    `;
                    return;
                }
                /*
                 * Giữ nguyên link tải.
                 *
                 * KHÔNG ghi đè targetUrl bằng link quảng cáo.
                 */
                const downloadUrl =
                    targetUrl;
                /*
                 * Link quảng cáo chỉ được mở riêng.
                 */
                const adUrl =
                    shouldShowAd
                        ? getRandomAdLink()
                        : null;
                /* =====================================================
                   THÔNG BÁO DỊCH VỤ
                   ===================================================== */
                if (!shouldShowAd) {
                    if (
                        targetUrl.includes(
                            "drive.google.com"
                        )
                    ) {
                        redirectTo(
                            downloadUrl
                        );
                        return;
                    }
                    if (
                        targetUrl.includes(
                            "pixeldrain.com"
                        )
                    ) {
                        showToast(
                            "🚀",
                            "Phát hiện Pixeldrain!",
                            "Giới hạn 6GB/ngày. Xem FAQ để biết mẹo tải.",
                            "#f78f90"
                        );
                    }
                    else if (
                        /terabox|1024tera|teraboxapp/i
                            .test(targetUrl)
                    ) {
                        showToast(
                            "☁️",
                            "Phát hiện Terabox!",
                            "Nên dùng App hoặc đăng nhập để tải nhanh hơn.",
                            "#54b5f5"
                        );
                    }
                    else if (
                        targetUrl.includes(
                            "buzzheavier.com"
                        )
                    ) {
                        showToast(
                            "⚡",
                            "Phát hiện Buzzheavier!",
                            "Dịch vụ tốc độ cao. Nếu lỗi hãy tắt VPN.",
                            "#ffeb3b"
                        );
                    }
                }
                /* =====================================================
                   XỬ LÝ SAU COUNTDOWN
                   ===================================================== */
                let timeLeft = 3;
                if (shouldShowAd) {
                    /*
                     * Không tự động mở popup sau countdown.
                     * Chờ click để browser cho phép window.open.
                     */
                    if (adNotice) {
                        adNotice.style.display =
                            "block";
                    }
                    if (titleEl) {
                        titleEl.innerText =
                            "QUẢNG CÁO ĐƯỢC YÊU CẦU";
                    }
                    if (textEl) {
                        textEl.innerText =
                            "Hãy bấm nút bên dưới để mở quảng cáo. Sau đó bạn sẽ được chuyển tới link tải.";
                    }
                    if (fastBtn) {
                        fastBtn.innerText =
                            "📢 MỞ QUẢNG CÁO & TẢI GAME";
                    }
                    if (loadingText) {
                        loadingText.innerText =
                            "Sau khi bấm, quảng cáo mở ở tab mới.";
                    }
                }
                /* =====================================================
                   CLICK BUTTON
                   ===================================================== */
                if (fastBtn) {
                    fastBtn.onclick =
                        function () {
                            /*
                             * Trường hợp cần quảng cáo.
                             */
                            if (shouldShowAd) {
                                openAdvertisement(
                                    adUrl
                                );
                                /*
                                 * Chờ một chút để tab quảng cáo
                                 * được tạo trước khi chuyển trang tải.
                                 */
                                setTimeout(
                                    function () {
                                        redirectTo(
                                            downloadUrl
                                        );
                                    },
                                    500
                                );
                                return;
                            }
                            /*
                             * Không cần quảng cáo.
                             */
                            redirectTo(
                                downloadUrl
                            );
                        };
                }
                /* =====================================================
                   COUNTDOWN
                   ===================================================== */
                const countdown =
                    setInterval(
                        function () {
                            timeLeft--;
                            if (timerEl) {
                                timerEl.innerText =
                                    timeLeft;
                            }
                            if (timeLeft <= 0) {
                                clearInterval(
                                    countdown
                                );
                                if (timerEl) {
                                    timerEl.style.display =
                                        "none";
                                }
                                /*
                                 * CÓ QUẢNG CÁO
                                 */
                                if (shouldShowAd) {
                                    /*
                                     * Không tự chuyển.
                                     * Hiện nút để người dùng click.
                                     */
                                    if (fastBtn) {
                                        fastBtn.style.display =
                                            "inline-block";
                                    }
                                    if (loadingText) {
                                        loadingText.innerText =
                                            "Bấm nút để mở quảng cáo và tiếp tục tải.";
                                    }
                                }
                                /*
                                 * KHÔNG CÓ QUẢNG CÁO
                                 */
                                else {
                                    if (fastBtn) {
                                        fastBtn.style.display =
                                            "none";
                                    }
                                    if (manualBtn) {
                                        manualBtn.href =
                                            downloadUrl;
                                        manualBtn.style.display =
                                            "inline-block";
                                    }
                                    redirectTo(
                                        downloadUrl
                                    );
                                }
                            }
                        },
                        1000
                    );
                /* =====================================================
                   LINK DỰ PHÒNG
                   ===================================================== */
                if (manualBtn) {
                    manualBtn.href =
                        downloadUrl;
                }
            }
            init();
        })();
    </script>
</body>
</html>
