<title>Đang Chuyển Hướng... | MDVH18</title>
<style>
  body { background: #0f0c29; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
</style>

<body>

<script>
(function() {
    if (window.__redirectScriptLoaded) return;
    window.__redirectScriptLoaded = true;

    const shopeeLinks = ["https://s.shopee.vn/1gIPlfm3xz"];

    function getRandomShopeeLink() {
        return shopeeLinks[Math.floor(Math.random() * shopeeLinks.length)];
    }

    const urlParams = new URLSearchParams(window.location.search);
    let encoded = urlParams.get('url');

    if (encoded) {
        try {
            let cleanEncoded = encoded.trim().replace(/\s/g, '+');
            let targetUrl = atob(cleanEncoded).replace(/[^\x21-\x7E]/g, '').trim();

            if (targetUrl.includes('mdvh18.com/mdvh18/')) {
                targetUrl = targetUrl.replace('mdvh18.com/mdvh18/', 'mdvh18.com/');
            }

            // 1. Mở link Shopee sang Tab mới
            const shopeeAnchor = document.createElement('a');
            shopeeAnchor.href = getRandomShopeeLink();
            shopeeAnchor.target = '_blank';
            shopeeAnchor.rel = 'noopener noreferrer';
            document.body.appendChild(shopeeAnchor);
            shopeeAnchor.click();

            // 2. Tab hiện tại chuyển thẳng sang link Game PixelDrain
            window.location.href = targetUrl;

        } catch (e) {
            document.body.innerHTML = "<h3>LỖI GIẢI MÃ LINK</h3>";
        }
    } else {
        document.body.innerHTML = "<h3>KHÔNG TÌM THẤY THAM SỐ LINK (?url=)</h3>";
    }
})();
</script>
</body>
