<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang Chuyển Hướng An Toàn... | MDVH18</title>
<style>
    body { background: #0f0c29; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
    .box { text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(215, 155, 187, 0.2); max-width: 400px; width: 90%; }
    .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #f78f90; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #timer { font-size: 3em; color: #d79bbb; font-weight: bold; margin: 10px 0; }
    .btn-manual, .btn-fast { display: inline-block; background: #f78f90; color: white; text-decoration: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; margin-top: 10px; transition: 0.3s; cursor: pointer; border: none; font-family: inherit; }
    .btn-manual { display: none; }
    .btn-fast { background: rgba(255, 255, 255, 0.1); border: 1px solid #f78f90; font-size: 0.9em; }
    .btn-manual:hover, .btn-fast:hover { background: #fff; color: #f78f90; box-shadow: 0 0 15px #f78f90; }
    .incognito-notice { background: rgba(255, 193, 7, 0.2); border: 1px dashed #ffc107; color: #ffe082; padding: 10px 14px; border-radius: 10px; font-size: 0.9em; margin-bottom: 15px; display: none; font-weight: bold; }
    .toast-custom { position: fixed; bottom: 30px; right: 30px; background: #1a1131; color: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 10000; font-family: "Segoe UI", sans-serif; max-width: 320px; animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<div class="box" id="main-box">
<div class="loader"></div>
<div id="incognito-alert" class="incognito-notice">🕵️ Phát hiện chế độ ẩn danh!</div>
<h3>HỆ THỐNG ĐANG KIỂM TRA</h3>
<p>Vui lòng chờ trong giây lát để lấy liên kết tải game an toàn.</p>
<div id="timer">3</div>
<button id="fast-link" class="btn-fast">TIẾP TỤC NGAY</button>
<a id="manual-link" class="btn-manual" href="#">NHẤN VÀO ĐÂY NẾU KHÔNG TỰ CHUYỂN</a>
</div>

<script>
(function() {
    const shopeeLinks = ["https://s.shopee.vn/1gIPlfm3xz"];

    function getRandomShopeeLink() {
        return shopeeLinks[Math.floor(Math.random() * shopeeLinks.length)];
    }

    // 1. Kiểm tra Ẩn danh (Ngưỡng 400MB)
    async function checkIncognito() {
        if ('storage' in navigator && 'estimate' in navigator.storage) {
            try {
                const { quota } = await navigator.storage.estimate();
                return quota < 400000000;
            } catch (e) {
                return false;
            }
        }
        return false;
    }

    // 2. Kiểm tra xem đã Bypass 7 ngày chưa
    function isShopeeBypassed() {
        try {
            const bypassTime = localStorage.getItem('shopee_click_time');
            if (!bypassTime) return false;
            const now = new Date().getTime();
            const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
            if ((now - parseInt(bypassTime)) < sevenDaysInMs) {
                return true;
            } else {
                localStorage.removeItem('shopee_click_time');
                return false;
            }
        } catch(e) {
            return false;
        }
    }

    async function init() {
        const hasBypassed = isShopeeBypassed();
        const isIncognito = await checkIncognito();
        const alertBox = document.getElementById('incognito-alert');

        let shouldRedirectToShopee = false;

        if (hasBypassed) {
            // Đã bypass ở trang chủ -> Bỏ qua Shopee
            shouldRedirectToShopee = false;
        } else if (isIncognito) {
            // Dùng Ẩn danh -> 100% bắt nhảy Shopee
            if (alertBox) alertBox.style.display = 'block';
            shouldRedirectToShopee = true; 
        } else {
            // Chế độ thường -> Tăng bộ đếm, đủ 10 lần thì nhảy Shopee
            let count = parseInt(localStorage.getItem('global_download_count') || '0') + 1;
            if (count >= 10) {
                localStorage.setItem('global_download_count', '0');
                shouldRedirectToShopee = true;
            } else {
                localStorage.setItem('global_download_count', count.toString());
                shouldRedirectToShopee = false;
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let encoded = urlParams.get('url');
        const timerEl = document.getElementById('timer');
        const manualBtn = document.getElementById('manual-link');
        const fastBtn = document.getElementById('fast-link');
        const boxEl = document.getElementById('main-box');
        
        let targetUrl = "";

        if (encoded) {
            try {
                let cleanEncoded = encoded.trim().replace(/\s/g, '+');
                targetUrl = atob(cleanEncoded).replace(/[^\x21-\x7E]/g, '').trim();

                if (targetUrl.includes('mdvh18.com/mdvh18/')) {
                    targetUrl = targetUrl.replace('mdvh18.com/mdvh18/', 'mdvh18.com/');
                }

                // HÀM CHUYỂN HƯỚNG QUAN TRỌNG
                const doRedirect = () => {
                    if (shouldRedirectToShopee) {
                        // Bắt buộc: Tab mới mở link Game, Tab hiện tại chuyển tới Shopee
                        window.open(targetUrl, '_blank');
                        window.location.href = getRandomShopeeLink();
                    } else {
                        // Không dính Shopee: Chuyển thẳng link Game
                        window.location.href = targetUrl;
                    }
                };

                // Gán sự kiện click cho nút "TIẾP TỤC NGAY"
                if (fastBtn) {
                    fastBtn.onclick = function(e) {
                        e.preventDefault();
                        doRedirect();
                    };
                }

                if (manualBtn) {
                    manualBtn.onclick = function(e) {
                        e.preventDefault();
                        doRedirect();
                    };
                }

                // Đếm ngược tự động 3 giây
                let timeLeft = 3;
                const countdown = setInterval(() => {
                    timeLeft--;
                    if (timerEl) timerEl.innerText = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        doRedirect();
                    }
                }, 1000);

            } catch (e) {
                if (boxEl) boxEl.innerHTML = "<h3>LỖI GIẢI MÃ</h3><p>Link không hợp lệ.</p>";
            }
        } else {
            if (boxEl) boxEl.innerHTML = "<h3>LỖI ĐƯỜNG DẪN</h3><p>Không tìm thấy liên kết.</p>";
        }
    }

    init();
})();
</script>
</body>
</html>
